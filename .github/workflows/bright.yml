name: Security Tests

on:
  pull_request:
    branches:
      - '*'

permissions:
  checks: write
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest

    env:
      BRIGHT_TARGET_URL: http://127.0.0.1:8080
      BRIGHT_HOSTNAME: ${{ vars.BRIGHT_HOSTNAME }}
      BRIGHT_PROJECT_ID: ${{ vars.BRIGHT_PROJECT_ID }}
      BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Maven dependencies
      run: mvn install

    - name: Install SecTester dependencies
      working-directory: .brightsec
      run: npm i --save=false @sectester/core @sectester/repeater @sectester/scan @sectester/runner

    - name: Start MySQL service
      run: |
        sudo service mysql start
        mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS lab_engenharia;"

    - name: Start application
      run: mvn spring-boot:run &

    - name: Wait for application to be ready
      run: |
        for i in {1..30}; do
          nc -zv 127.0.0.1 8080 && echo "Application is ready" && exit 0
          sleep 10
        done
        echo "Application did not start in time" && exit 1

    - name: Run security tests
      run: |
        node --experimental-transform-types --experimental-strip-types --experimental-detect-module \
        --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning \
        --test-force-exit --test .brightsec/tests/*.test.ts --test-concurrency=4
